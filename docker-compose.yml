version: "3.9"

services:
  api:
    build: .
    container_name: backend-api
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_DB: collaborative-workspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: inba@Pg
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis-cache

volumes:
  pg_data:
